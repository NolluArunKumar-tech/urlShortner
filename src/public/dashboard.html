<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener — Analytics Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f7f8fa;
      color: #1f2328;
    }
    header {
      background: #1f2328;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 0.85rem; color: #adb5bd; margin-left: auto; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 24px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #3b82d4; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; color: #57606a; background: #f7f8fa; cursor: pointer; user-select: none; }
    th:hover { color: #3b82d4; }
    td a { color: #3b82d4; text-decoration: none; word-break: break-all; }
    td a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      background: #3b82d4;
      color: #fff;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .key-form { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .key-form input {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.92rem;
      font-family: monospace;
    }
    .key-form button {
      background: #1f2328;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .key-form button:hover { background: #3b82d4; }
    #status { font-size: 0.88rem; color: #57606a; margin-bottom: 16px; min-height: 1.4em; }
    .error { color: #c0392b; }
    .empty { color: #57606a; font-style: italic; }
    .short-link { font-family: monospace; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <h1>&#9279; URL Shortener Analytics</h1>
    <span id="clock"></span>
  </header>
  <div class="container">
    <div class="card">
      <h2>API Key</h2>
      <div class="key-form">
        <input type="password" id="apiKeyInput" placeholder="Enter your X-API-Key" />
        <button id="loadBtn">Load Dashboard</button>
      </div>
      <div id="status">Enter your API key above to load analytics data.</div>
    </div>
    <div class="card">
      <h2>&#128200; Top URLs by Clicks</h2>
      <table id="topTable">
        <thead>
          <tr>
            <th data-col="rank">#</th>
            <th data-col="shortCode">Short Code</th>
            <th data-col="originalUrl">Original URL</th>
            <th data-col="clickCount">Clicks &#9660;</th>
            <th data-col="createdAt">Created At</th>
          </tr>
        </thead>
        <tbody id="topBody">
          <tr><td colspan="5" class="empty">No data loaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Clock
    const clockEl = document.getElementById('clock');
    function tick() { clockEl.textContent = new Date().toLocaleTimeString(); }
    tick(); setInterval(tick, 1000);

    // Sort state
    let sortCol = 'clickCount';
    let sortAsc = false;
    let tableData = [];

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function renderTable(data) {
      const tbody = document.getElementById('topBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No URLs found.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map((row, i) => `
        <tr>
          <td>${i + 1}</td>
          <td class="short-link"><a href="/${row.shortCode}" target="_blank">/${row.shortCode}</a></td>
          <td><a href="${row.originalUrl}" target="_blank" title="${row.originalUrl}">${row.originalUrl.length > 60 ? row.originalUrl.slice(0, 60) + '…' : row.originalUrl}</a></td>
          <td><span class="badge">${row.clickCount}</span></td>
          <td>${formatDate(row.createdAt)}</td>
        </tr>
      `).join('');
    }

    function sortData(data, col, asc) {
      return [...data].sort((a, b) => {
        const va = a[col]; const vb = b[col];
        if (va == null) return 1; if (vb == null) return -1;
        if (typeof va === 'number') return asc ? va - vb : vb - va;
        return asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
      });
    }

    document.querySelectorAll('#topTable th').forEach((th) => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (!col || col === 'rank') return;
        if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
        renderTable(sortData(tableData, sortCol, sortAsc));
      });
    });

    async function loadDashboard() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const status = document.getElementById('status');
      if (!apiKey) { status.textContent = 'Please enter an API key.'; status.className = 'error'; return; }

      status.textContent = 'Loading…';
      status.className = '';
      try {
        const res = await fetch('/api/analytics/top?limit=50', {
          headers: { 'X-API-Key': apiKey }
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          status.textContent = `Error ${res.status}: ${err.message || res.statusText}`;
          status.className = 'error';
          return;
        }
        const data = await res.json();
        tableData = data.top || [];
        renderTable(sortData(tableData, sortCol, sortAsc));
        status.textContent = `Loaded ${tableData.length} URL(s). Last refreshed: ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        status.textContent = `Network error: ${e.message}`;
        status.className = 'error';
      }
    }

    document.getElementById('loadBtn').addEventListener('click', loadDashboard);
    document.getElementById('apiKeyInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadDashboard();
    });
  </script>
</body>
</html>
